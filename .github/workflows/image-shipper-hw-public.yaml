name: Docker Simple Push

on:
    workflow_dispatch:
        inputs:
            docker_image:
                description: "要转存的 Docker 镜像地址"
                required: true
                default: "nginx:latest"

env:
    ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
    ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
    ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
    ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
    HUAWEI_AK: "${{ secrets.HW_AK }}"
    HUAWEI_SK: "${{ secrets.HW_SK }}"
    HUAWEI_PROJECT_ID: "${{ secrets.HUAWEI_PROJECT_ID }}"
    HUAWEI_REGION: "${{ secrets.HUAWEI_REGION }}"

jobs:
    build:
        name: Pull and Push
        runs-on: ubuntu-latest
        steps:
            - name: Before freeing up disk space
              run: |
                  echo "Before freeing up disk space"
                  echo "=============================================================================="
                  df -hT
                  echo "=============================================================================="

            - name: Restart docker
              run: sudo service docker restart

            - name: Free up disk space complete
              run: |
                  echo "Free up disk space complete"
                  echo "=============================================================================="
                  df -hT
                  echo "=============================================================================="

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Docker Setup Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push image
              run: |
                  # 登录目标仓库
                  docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY

                  # 获取输入的镜像地址
                  DOCKER_IMAGE="${{ github.event.inputs.docker_image }}"
                  echo "Source image: $DOCKER_IMAGE"

                  # 拉取镜像
                  echo "Pulling image: $DOCKER_IMAGE"
                  docker pull $DOCKER_IMAGE

                  # 检查是否包含平台信息
                  platform=$(echo "$DOCKER_IMAGE" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
                  echo "platform is $platform"

                  # 如果存在架构信息 将架构信息拼到镜像名称前面
                  if [ -z "$platform" ]; then
                      platform_prefix=""
                  else
                      platform_prefix="${platform//\//_}_"
                  fi
                  echo "platform_prefix is $platform_prefix"

                  # 获取镜像的完整名称
                  image=$(echo "$DOCKER_IMAGE" | awk '{print $NF}')

                  # 获取镜像名称和标签，保留原始输入格式
                  image_name_tag="${image%%@*}"
                  echo "image_name_tag: $image_name_tag"

                  # 构建新镜像名称，直接使用原始输入
                  new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$image_name_tag"
                  echo "New image: $new_image"

                  # 计算仓库 repository 名称（去掉 tag，供后续设置公开使用）
                  repo_name="$platform_prefix${image_name_tag%:*}"
                  echo "Repo name: $ALIYUN_NAME_SPACE/$repo_name"
                  echo "REPO_NAME=$repo_name" >> "$GITHUB_ENV"

                  # 标记并推送镜像
                  echo "Tagging image: $image -> $new_image"
                  docker tag $image $new_image
                  echo "Pushing image: $new_image"
                  docker push $new_image

                  # 清理镜像
                  echo "开始清理磁盘空间"
                  echo "=============================================================================="
                  df -hT
                  echo "=============================================================================="
                  docker rmi $image
                  docker rmi $new_image
                  echo "磁盘空间清理完毕"
                  echo "=============================================================================="
                  df -hT
                  echo "=============================================================================="

            - name: Set SWR repository public
              run: |
                  set -uo pipefail

                  # 仓库名中如带 /，需先替换为 $ 再请求（SWR 文档要求）
                  REPO_PARAM="${REPO_NAME//\//\$}"

                  HOST="swr-api.${HUAWEI_REGION}.myhuaweicloud.com"
                  URI="/v2/manage/namespaces/${ALIYUN_NAME_SPACE}/repos/${REPO_PARAM}"
                  BODY='{"is_public": true, "description": "public"}'
                  SDK_DATE=$(date -u +%Y%m%dT%H%M%SZ)

                  # 1. 华为云 SDK-HMAC-SHA256 请求签名（直接用 AK/SK，无需 Token）
                  hash_hex() { printf '%s' "$1" | openssl dgst -sha256 -hex | awk '{print $NF}'; }

                  BODY_HASH=$(hash_hex "$BODY")
                  CANON_HEADERS=$(printf 'content-type:%s\nhost:%s\nx-sdk-date:%s\n' "application/json" "$HOST" "$SDK_DATE")
                  SIGNED="content-type;host;x-sdk-date"
                  CANON_REQ=$(printf 'PATCH\n%s\n\n%s\n%s\n%s' "$URI" "$CANON_HEADERS" "$SIGNED" "$BODY_HASH")
                  STS=$(printf 'SDK-HMAC-SHA256\n%s\n%s' "$SDK_DATE" "$(hash_hex "$CANON_REQ")")
                  SIGNATURE=$(printf '%s' "$STS" | openssl dgst -sha256 -hmac "$HUAWEI_SK" -hex | awk '{print $NF}')

                  # 2. 调用 UpdateRepo 将仓库设置为公开，成功返回 201
                  STATUS=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X PATCH \
                      "https://${HOST}${URI}" \
                      -H "Content-Type: application/json" \
                      -H "X-Sdk-Date: ${SDK_DATE}" \
                      -H "Authorization: SDK-HMAC-SHA256 Access=${HUAWEI_AK}, SignedHeaders=${SIGNED}, Signature=${SIGNATURE}" \
                      -d "$BODY")

                  echo "HTTP status: $STATUS"
                  if [ "$STATUS" = "201" ]; then
                      echo "✅ ${ALIYUN_NAME_SPACE}/${REPO_NAME} 已设置为公开"
                  else
                      cat /tmp/resp.txt || true
                      exit 1
                  fi
